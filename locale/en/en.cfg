[mod-setting-name]
lrh_window-position=Position of the Helper window
lrh_separate-quality-shortcut=Use built-in game control for changing quality

[mod-setting-description]
lrh_separate-quality-shortcut=When enabled you can use the default alt+scroll shortcut to change quality of the hovered item in the GUI (note: changing quality in the GUI this way also changes the quality selector in the crafting tab - unfortunately there's nothing I can do about that)

[string-mod-setting]
lrh_window-position-lrhval_floating=Floating - top left
lrh_window-position-lrhval_left=Attached - left
lrh_window-position-lrhval_right=Attached - right

[lrh-tooltip]
default-shortcuts=[font=default-bold]Left click:[/font] +1 stack size\n[font=default-bold]Right click:[/font] -1 stack size\n[font=default-bold]Middle click:[/font] Clear request\n\n[font=default-bold]Click:[/font] Modify both MIN and MAX\n[font=default-bold]Control + click:[/font] Modify MIN only\n[font=default-bold]Shift + click:[/font] Modify MAX only\n[font=default-bold]Alt + left click:[/font] Set MAX to infinite\n\n
quality-shortcuts=[font=default-bold]__1__:[/font] Increase quality\n[font=default-bold]__2__:[/font] Decrease quality
default-shortcuts-alt=[font=default-bold]Left click:[/font] ↑ Add +1 stack to min & max \n[font=default-bold]Shift + Left click:[/font] ↑ Add +1 stack to max only \n[font=default-bold]Control + left click:[/font] ↑ Add +1 stack to min only\n[font=default-bold]Alt + left click:[/font] ↑ Set max to infinite\n[font=default-bold]Right click:[/font] ↓ Subtract -1 stack from min & max\n[font=default-bold]Shift + right click:[/font] ↓ Subtract -1 stack from max only\n[font=default-bold]Control + right click:[/font] ↓ Subtract -1 stack from min only\n[font=default-bold]Middle click:[/font] Clear request\n\n[font=default-bold]Q:[/font] Increase quality of hovered item\n[font=default-bold]Shift + Q:[/font]Decrease quality of hovered item


[controls]
lrh_increase_quality=Increase quality
lrh_decrease_quality=Decrease quality

[lrh-click-action]
default=Default +/- 1 stack
half_stack=+/- ½ stack
rocket_load=+/- 1 rocket load
stack_0_1=Set min/max to 0/1 stack
stack_1_2=Set min/max to 1/2 stacks